# ThinkNux sysfs permissions configuration for systemd-tmpfiles
# Grants write permissions for ThinkPad hardware controls across reboots

z /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor 0666 - - -
z /sys/devices/system/cpu/intel_pstate/no_turbo 0666 - - -
z /sys/devices/system/cpu/cpufreq/boost 0666 - - -
z /sys/class/power_supply/BAT*/charge_control_* 0666 - - -
z /sys/class/power_supply/BAT*/charge_*_threshold 0666 - - -
z /sys/class/power_supply/BAT*/charge_behaviour 0666 - - -
z /sys/devices/platform/i8042/serio*/serio*/sensitivity 0666 - - -
z /sys/devices/platform/i8042/serio*/serio*/press_to_select 0666 - - -
z /sys/devices/platform/i8042/serio*/serio*/rate 0666 - - -
z /sys/devices/platform/i8042/serio*/serio*/resolution 0666 - - -
z /sys/class/leds/tpacpi::*/brightness 0666 - - -
z /sys/class/leds/tpacpi::*/trigger 0666 - - -
